<style>
  :root{--forest:#2c5234;--gold:#B9975B;--cream:#fdf8ef;--sage:#4a7c59;--light-green:#eaf3ec;--text:#2c2c2c;--muted:#6b6b6b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--cream);font-family:'Book Antiqua','Palatino Linotype',Palatino,Georgia,serif;}
  .header{background:var(--forest);padding:24px 48px 20px;display:flex;align-items:center;gap:28px;}
  .logo-box{background:rgba(255,255,255,.1);border:1.5px solid rgba(185,151,91,.55);color:#fff;font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:10px 22px;flex-shrink:0;}
  .header-title{color:var(--cream);font-size:12px;letter-spacing:.32em;text-transform:uppercase;}
  .header-divider{flex:1;height:1px;background:linear-gradient(to right,var(--gold),transparent);}
  .page{padding:40px 20px 60px;overflow-x:auto;}
  .chart-title{text-align:center;font-size:19px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--forest);margin-bottom:8px;}
  .chart-rule{width:90px;height:2px;background:var(--gold);margin:0 auto 40px;}
  svg.org{display:block;margin:0 auto;overflow:visible;}
</style>
